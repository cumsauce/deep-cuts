name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package plugin
        run: |
          manifest=$(find dist -name plugin.yml | head -1)
          test -n "$manifest"
          test -f "$(dirname "$manifest")/plugin.js"
          mkdir -p package
          cp -R "$(dirname "$manifest")" package/local.deep-cuts
          (cd package && zip -r ../deep-cuts.zip local.deep-cuts)
      - uses: actions/upload-artifact@v4
        with:
          name: deep-cuts
          path: deep-cuts.zip
      - name: Update latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest deep-cuts.zip --title "Latest build" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
